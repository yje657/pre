<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도쿄 여행 플래너</title>
  <link rel="stylesheet" href="style.css">
  <!-- 구글 지도 API (Places 라이브러리 포함) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDv4ueTAj-YS2GfoV6qoZr9Aj7KfG7Yo5o_KEY&libraries=places&language=ko&region=KR"></script>
</head>
<body>

  <div id="appContainer" class="app-container">
    
    <!-- 1. 상단 지도 영역 -->
    <div id="mapContainer" class="map-container">
      <div id="map"></div>
    </div>

    <!-- 2. 하단 시트 (타임라인 및 일정 관리) -->
    <div id="bottomSheet" class="bottom-sheet">
      <div id="sheetHandleBar" class="sheet-handle-bar">
        <div class="handle-bar-knob"></div>
      </div>

      <!-- Day 선택 탭 -->
      <div class="day-selector">
        <button class="day-chip active" onclick="selectDay(1)">Day 1<span class="day-date">11.28 토</span></button>
        <button class="day-chip" onclick="selectDay(2)">Day 2<span class="day-date">11.29 일</span></button>
        <button class="day-chip" onclick="selectDay(3)">Day 3<span class="day-date">11.30 월</span></button>
        <button class="day-chip" onclick="selectDay(4)">Day 4<span class="day-date">12.01 화</span></button>
        <button class="day-chip" onclick="selectDay(5)">Day 5<span class="day-date">12.02 수</span></button>
      </div>

      <!-- 타임라인 리스트 -->
      <div id="timelineList" class="timeline-list">
        <!-- 동적 렌더링 -->
      </div>

      <!-- 하단 고정 버튼 영역 -->
      <div class="bottom-actions">
        <button class="action-btn primary" onclick="openPage('addPage')">+ 장소 추가</button>
        <button class="action-btn secondary" onclick="openPage('memoPage')">📝 메모 추가</button>
      </div>
    </div>

    <!-- 3. 장소 추가 모달 페이지 -->
    <div id="addPage" class="sub-page">
      <div class="sub-page-header">
        <h2>장소 일정 추가</h2>
        <button class="close-btn" onclick="closePage('addPage')">✕</button>
      </div>
      <div class="sub-page-content">
        
        <!-- Day 선택 칩 영역 -->
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px;">추가할 날짜 (Day)</label>
          <div id="modalDayChips" style="display: flex; gap: 6px;">
            <button type="button" class="modal-day-chip active" onclick="setModalDay(1)" style="flex:1; padding: 6px 0; border: 1px solid #cbd5e1; background: #2563eb; color: #ffffff; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Day 1</button>
            <button type="button" class="modal-day-chip" onclick="setModalDay(2)" style="flex:1; padding: 6px 0; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Day 2</button>
            <button type="button" class="modal-day-chip" onclick="setModalDay(3)" style="flex:1; padding: 6px 0; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Day 3</button>
            <button type="button" class="modal-day-chip" onclick="setModalDay(4)" style="flex:1; padding: 6px 0; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Day 4</button>
            <button type="button" class="modal-day-chip" onclick="setModalDay(5)" style="flex:1; padding: 6px 0; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Day 5</button>
          </div>
        </div>

        <div class="form-group">
          <label>시간</label>
          <input type="time" id="placeTimeInput" class="form-input">
        </div>
        <div class="form-group">
          <label>장소명</label>
          <input type="text" id="placeSearchInput" class="form-input" placeholder="장소 이름을 입력하세요">
        </div>
        <div class="form-group">
          <label>설명 / 메모</label>
          <input type="text" id="placeSubInput" class="form-input" placeholder="예: 쇼핑 및 점심 식사">
        </div>
        <button class="submit-btn" onclick="addPlace()">일정에 추가하기</button>
      </div>
    </div>

    <!-- 4. 메모 추가 모달 페이지 -->
    <div id="memoPage" class="sub-page">
      <div class="sub-page-header">
        <h2>메모 추가</h2>
        <button class="close-btn" onclick="closePage('memoPage')">✕</button>
      </div>
      <div class="sub-page-content">
        <div class="form-group">
          <label>시간</label>
          <input type="time" id="memoTimeInput" class="form-input">
        </div>
        <div class="form-group">
          <label>메모 내용</label>
          <textarea id="memoTextInput" class="form-input" placeholder="메모 내용을 입력하세요" rows="4"></textarea>
        </div>
        <button class="submit-btn" onclick="addMemo()">메모 추가하기</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
