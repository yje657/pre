<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도쿄 여행 플래너 (11/28 - 12/02)</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --primary-dark: #1e3a8a;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      color: white;
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-sub {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Day Tabs */
    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1;
      min-width: 70px;
      padding: 10px 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn .day-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .tab-btn .day-date {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .tab-btn.active .day-title,
    .tab-btn.active .day-date {
      color: white;
    }

    /* Schedule List */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .card.completed {
      opacity: 0.55;
      background-color: #f1f5f9;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .card.completed .custom-checkbox {
      background: var(--primary);
      border-color: var(--primary);
    }

    .custom-checkbox::after {
      content: "✓";
      color: white;
      font-size: 12px;
      display: none;
    }

    .card.completed .custom-checkbox::after {
      display: block;
    }

    .time-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-light);
      background: #eff6ff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .tag-move { background: #e0f2fe; color: #0369a1; }
    .tag-food { background: #ffedd5; color: #c2410c; }
    .tag-shop { background: #fce7f3; color: #be185d; }
    .tag-spot { background: #dcfce7; color: #15803d; }
    .tag-etc { background: #f1f5f9; color: #475569; }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card.completed .card-title {
      text-decoration: line-through;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      padding-left: 30px;
    }

    .card-btn-group {
      display: flex;
      gap: 6px;
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
    }

    .icon-btn:hover {
      color: var(--text-main);
    }

    /* Modal Form */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal h2 {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary-light);
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-top">
        <h1>도쿄 여행 플래너 ✈️</h1>
      </div>
      <div class="header-sub">2026.11.28(토) - 12.02(수) | 4박 5일</div>
      <div class="header-actions">
        <button class="btn-action" onclick="openAddModal()">+ 일정 추가</button>
        <button class="btn-action" onclick="resetToDefault()">초기화</button>
      </div>
    </header>

    <div class="day-tabs">
      <div class="tab-btn active" onclick="switchDay(1)">
        <div class="day-title">1일차</div>
        <div class="day-date">11.28 토</div>
      </div>
      <div class="tab-btn" onclick="switchDay(2)">
        <div class="day-title">2일차</div>
        <div class="day-date">11.29 일</div>
      </div>
      <div class="tab-btn" onclick="switchDay(3)">
        <div class="day-title">3일차</div>
        <div class="day-date">11.30 월</div>
      </div>
      <div class="tab-btn" onclick="switchDay(4)">
        <div class="day-title">4일차</div>
        <div class="day-date">12.01 화</div>
      </div>
      <div class="tab-btn" onclick="switchDay(5)">
        <div class="day-title">5일차</div>
        <div class="day-date">12.02 수</div>
      </div>
    </div>

    <div class="schedule-list" id="scheduleList">
      <!-- 동적 일정 카드 생성 영역 -->
    </div>
  </div>

  <!-- 일정 추가/수정 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">일정 추가</h2>
      <input type="hidden" id="editId">
      
      <div class="form-row">
        <div class="form-group">
          <label>일차</label>
          <select id="formDay">
            <option value="1">1일차 (11.28)</option>
            <option value="2">2일차 (11.29)</option>
            <option value="3">3일차 (11.30)</option>
            <option value="4">4일차 (12.01)</option>
            <option value="5">5일차 (12.02)</option>
          </select>
        </div>
        <div class="form-group">
          <label>카테고리</label>
          <select id="formCategory">
            <option value="move">이동</option>
            <option value="food">식사</option>
            <option value="shop">쇼핑</option>
            <option value="spot">관광/테마</option>
            <option value="etc">기타</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>시간대</label>
        <input type="text" id="formTime" placeholder="예: 14:00 - 15:00">
      </div>

      <div class="form-group">
        <label>일정 제목</label>
        <input type="text" id="formTitle" placeholder="예: 신주쿠 GU 쇼핑">
      </div>

      <div class="form-group">
        <label>상세 내용 (선택)</label>
        <textarea id="formDesc" rows="3" placeholder="메모할 내용을 입력하세요"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn-primary" onclick="saveSchedule()">저장</button>
      </div>
    </div>
  </div>

  <script>

      { id: '2-9', day: 2, time: '15:15 - 15:45', category: 'spot', title: '시바 공원 피크닉', desc: '도쿄타워 배경 사진 촬영 & 소금빵 타임', completed: false },
      { id: '2-10', day: 2, time: '15:45 - 17:00', category: 'spot', title: '도쿄타워 메인 데크', desc: '16:00 입장 / 16:28 일몰 & 16:50 라이트업 감상', completed: false },

      // 5일차
      { id: '5-1', day: 5, time: '06:30 - 07:00', category: 'etc', title: '체크아웃', desc: '에어비앤비 퇴실 및 신주쿠역 이동', completed: false },
      { id: '5-2', day: 5, time: '07:00 - 07:18', category: 'move', title: 'N\'EX 승차장 이동', desc: '신주쿠역 JR N\'EX 승강장 대기', completed: false },
      { id: '5-3', day: 5, time: '07:18 - 08:37', category: 'move', title: '공항 이동 (N\'EX)', desc: '신주쿠 출발 -> 나리타 T2 도착 (07:18 탑승)', completed: false },
      { id: '5-4', day: 5, time: '08:37 - 09:00', category: 'move', title: 'T3 터미널 이동', desc: '셔틀버스 또는 도보 이동', completed: false },
      { id: '5-5', day: 5, time: '09:00 - 11:50', category: 'etc', title: '출국 수속 & 면세점', desc: '이스타항공(T3) 수속, 보안검색, 면세 쇼핑', completed: false },
      { id: '5-6', day: 5, time: '11:50 ~', category: 'spot', title: '인천으로 출발', desc: '이스타항공 ZE602 탑승 및 귀국 ✈️', completed: false }
    ];

    let currentDay = 1;
    let schedules = [];

    const categoryNames = {
      move: '이동',
      food: '식사',
      shop: '쇼핑',
      spot: '관광/테마',
      etc: '기타'
    };

    // App Init
    window.onload = () => {
      loadData();
      renderSchedules();
    };

    function loadData() {
      const saved = localStorage.getItem('tokyo_schedule_data');
      if (saved) {
        schedules = JSON.parse(saved);
      } else {
        schedules = [...DEFAULT_SCHEDULES];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('tokyo_schedule_data', JSON.stringify(schedules));
    }

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === day);
      });
      renderSchedules();
    }

    function renderSchedules() {
      const listEl = document.getElementById('scheduleList');
      listEl.innerHTML = '';

      const dayItems = schedules.filter(item => item.day === currentDay);

      if (dayItems.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 0.9rem;">등록된 일정이 없습니다.</div>';
        return;
      }

      dayItems.forEach(item => {
        const card = document.createElement('div');
        card.className = `card ${item.completed ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="card-header">
            <div class="card-left">
              <div class="custom-checkbox" onclick="toggleComplete('${item.id}')"></div>
              <span class="time-badge">${item.time}</span>
              <span class="tag tag-${item.category}">${categoryNames[item.category] || '기타'}</span>
            </div>
            <div class="card-btn-group">
              <button class="icon-btn" onclick="openEditModal('${item.id}')">수정</button>
              <button class="icon-btn" onclick="deleteSchedule('${item.id}')">삭제</button>
            </div>
          </div>
          <div class="card-title">${item.title}</div>
          ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
        `;

        listEl.appendChild(card);
      });
    }

    function toggleComplete(id) {
      const item = schedules.find(s => s.id === id);
      if (item) {
        item.completed = !item.completed;
        saveData();
        renderSchedules();
      }
    }

    function resetToDefault() {
      if (confirm('모든 일정을 초기 데이터로 되돌리시겠습니까?')) {
        schedules = JSON.parse(JSON.stringify(DEFAULT_SCHEDULES));
        saveData();
        renderSchedules();
      }
    }

    // Modal Operations
    function openAddModal() {
      document.getElementById('modalTitle').innerText = '일정 추가';
      document.getElementById('editId').value = '';
      document.getElementById('formDay').value = currentDay;
      document.getElementById('formCategory').value = 'spot';
      document.getElementById('formTime').value = '';
      document.getElementById('formTitle').value = '';
      document.getElementById('formDesc').value = '';
      
      document.getElementById('modalOverlay').classList.add('active');
    }

    function openEditModal(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('modalTitle').innerText = '일정 수정';
      document.getElementById('editId').value = item.id;
      document.getElementById('formDay').value = item.day;
      document.getElementById('formCategory').value = item.category;
      document.getElementById('formTime').value = item.time;
      document.getElementById('formTitle').value = item.title;
      document.getElementById('formDesc').value = item.desc || '';

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function saveSchedule() {
      const id = document.getElementById('editId').value;
      const day = parseInt(document.getElementById('formDay').value, 10);
      const category = document.getElementById('formCategory').value;
      const time = document.getElementById('formTime').value || '시간 미정';
      const title = document.getElementById('formTitle').value;
      const desc = document.getElementById('formDesc').value;

      if (!title) {
        alert('일정 제목을 입력해주세요.');
        return;
      }

      if (id) {
        // Edit
        const item = schedules.find(s => s.id === id);
        if (item) {
          item.day = day;
          item.category = category;
          item.time = time;
          item.title = title;
          item.desc = desc;
        }
      } else {
        // Add
        const newSchedule = {
          id: Date.now().toString(),
          day,
          category,
          time,
          title,
          desc,
          completed: false
        };
        schedules.push(newSchedule);
      }

      saveData();
      closeModal();
      
      // If day was changed in modal, switch tab to target day
      if (currentDay !== day) {
        switchDay(day);
      } else {
        renderSchedules();
      }
    }

    function deleteSchedule(id) {
      if (confirm('이 일정을 삭제하시겠습니까?')) {
        schedules = schedules.filter(s => s.id !== id);
        saveData();
        renderSchedules();
      }
    }
  </script>
</body>
</html>
