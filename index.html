<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡️청주 여행 초특급 초대장⚡️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Single+Day&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d13b0c2f4711c01b29565f88b9168268&libraries=services"></script>

    <style>
        :root {
            --bg-yellow: #ffe600;
            --pink-accent: #ff0055;
            --blue-accent: #0022ff;
            --green-accent: #00e676;
            --black: #000000;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Gaegu', cursive, sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; min-height: 100vh; background-color: #1a1a2e;
            background-image: radial-gradient(#ff007f 10%, transparent 11%), radial-gradient(#00d2ff 10%, transparent 11%);
            background-size: 24px 24px; display: flex; justify-content: center; align-items: flex-start; padding: 12px;
        }

        .app-container {
            width: 100%; max-width: 440px; background-color: var(--bg-yellow); border: 4px solid var(--black);
            border-radius: 20px; box-shadow: 6px 8px 0px var(--black); overflow: hidden; position: relative;
            display: flex; flex-direction: column; margin: auto; margin-top: 10px;
        }

        /* 초대장 메인 화면 스타일 */
        .sticker { position: absolute; z-index: 10; font-size: clamp(24px, 7vw, 32px); filter: drop-shadow(2px 2px 0px #000); pointer-events: none; animation: bounce 2.5s infinite ease-in-out; }
        .sticker-1 { top: 12px; right: 12px; transform: rotate(15deg); }
        .sticker-2 { top: 38%; left: -4px; transform: rotate(-20deg); }
        .sticker-3 { bottom: 90px; right: -2px; transform: rotate(25deg); }
        @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(10deg); } 50% { transform: translateY(-6px) rotate(-5deg); } }

        #invitation-screen { padding: 20px 16px 0 16px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .header-section { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0 14px 0; }
        .red-badge { background-color: var(--pink-accent); color: var(--white); padding: 10px 14px; border-radius: 50% 40% 60% 45% / 40% 60% 40% 55%; border: 3.5px solid var(--black); font-size: clamp(20px, 5.5vw, 26px); font-weight: 700; transform: rotate(-10deg); box-shadow: 3px 3px 0px var(--black); }
        .main-title { font-size: clamp(48px, 13vw, 64px); font-weight: 700; color: var(--blue-accent); text-shadow: 2px 2px 0px var(--white), 4px 4px 0px var(--black); transform: rotate(1deg); font-family: 'Single Day', cursive; }
        
        .paper-box { width: 100%; background-color: var(--white); border: 3.5px solid var(--black); border-radius: 14px; padding: 24px 14px 18px 14px; box-shadow: 5px 5px 0px var(--black); margin-bottom: 16px; position: relative; }
        .tape-top { position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 110px; height: 24px; background-color: rgba(255, 0, 128, 0.75); border: 2px solid var(--black); }
        .info-line { font-size: clamp(22px, 6vw, 27px); font-weight: 700; color: var(--black); margin-bottom: 12px; }
        .info-line span.highlight { background-color: #a6f4ff; padding: 2px 8px; border-radius: 8px; border: 2px solid var(--black); }

        .bottom-action-bar { width: calc(100% + 32px); margin-left: -16px; margin-right: -16px; background-color: var(--blue-accent); border-top: 4px solid var(--black); padding: 16px 18px; text-align: center; }
        .btn-enter { width: 100%; padding: 14px 18px; background-color: var(--pink-accent); color: var(--white); border: 3.5px solid var(--black); border-radius: 35px; font-size: clamp(24px, 6.5vw, 30px); font-weight: 700; font-family: 'Jua', sans-serif; cursor: pointer; box-shadow: 0px 6px 0px var(--black); }

        /* 일정 화면 스타일 */
        #schedule-screen { display: none; padding: 18px 16px; background-color: var(--bg-yellow); flex-direction: column; width: 100%; min-height: 80vh; }
        #schedule-screen.active { display: flex; }
        .schedule-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .schedule-header-title { font-size: clamp(24px, 7vw, 30px); font-weight: 700; color: var(--blue-accent); background-color: var(--white); padding: 6px 12px; border: 3.5px solid var(--black); border-radius: 12px; box-shadow: 4px 4px 0px var(--black); font-family: 'Single Day', cursive; }
        .btn-back { background-color: var(--pink-accent); color: var(--white); border: 3px solid var(--black); border-radius: 10px; padding: 6px 12px; font-size: clamp(16px, 4.5vw, 20px); font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0px var(--black); }

        #map { width: 100%; height: 240px; border: 3.5px solid var(--black); border-radius: 12px; box-shadow: 4px 4px 0px var(--black); margin-bottom: 16px; background-color: #ddd; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; color: #555; }

        .btn-open-modal { width: 100%; background-color: var(--green-accent); color: var(--black); border: 3.5px solid var(--black); border-radius: 12px; padding: 12px; font-size: 22px; font-weight: 700; cursor: pointer; box-shadow: 4px 4px 0px var(--black); margin-bottom: 18px; }
        .btn-open-modal:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--black); }

        .day-card { background-color: var(--white); border: 3.5px solid var(--black); border-radius: 14px; padding: 16px 14px; box-shadow: 5px 5px 0px var(--black); }
        .day-title-tag { display: inline-block; background-color: var(--pink-accent); color: var(--white); font-size: 24px; font-weight: 700; padding: 3px 14px; border: 3px solid var(--black); border-radius: 24px; margin-bottom: 12px; box-shadow: 3px 3px 0px var(--black); }
        .schedule-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .schedule-item { display: flex; align-items: center; background-color: #f0f4ff; border: 3px solid var(--black); border-radius: 10px; padding: 10px 12px; font-size: 20px; font-weight: 700; gap: 10px; box-shadow: 3px 3px 0px var(--black); }
        .time-badge { background-color: var(--bg-yellow); color: var(--black); padding: 2px 8px; border: 2px solid var(--black); border-radius: 8px; font-size: 18px; white-space: nowrap; }
        .item-text { color: var(--black); flex: 1; word-break: keep-all; }

        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: #a6f4ff; border: 4px solid var(--black); border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; box-shadow: 6px 6px 0px var(--black); display: flex; flex-direction: column; gap: 12px; }
        .modal-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; color: var(--black); text-align: center; font-family: 'Jua', sans-serif; }
        
        .modal-content input { width: 100%; padding: 10px; border: 3px solid var(--black); border-radius: 8px; font-size: 18px; font-family: 'Gaegu', cursive; font-weight: 700; }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn-modal-add { flex: 2; background-color: var(--pink-accent); color: var(--white); border: 3px solid var(--black); border-radius: 8px; padding: 10px; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0px var(--black); }
        .btn-modal-close { flex: 1; background-color: var(--white); color: var(--black); border: 3px solid var(--black); border-radius: 8px; padding: 10px; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0px var(--black); }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="invitation-screen">
            <div class="sticker sticker-1">💖</div>
            <div class="sticker sticker-2">⭐</div>
            <div class="sticker sticker-3">💥</div>
            <div class="header-section">
                <div class="red-badge">청주<br>여행</div>
                <div class="main-title">초댓장</div>
            </div>
            <div class="paper-box">
                <div class="tape-top"></div>
                <div class="info-line">📍 <span class="highlight">목적지:</span> 충북 청주 일대</div>
                <div class="info-line">🗓️ <span class="highlight">일시:</span> 1박 2일 투어</div>
            </div>
            <div class="bottom-action-bar">
                <button class="btn-enter" onclick="showSchedule()">👉 일정 확인하기 👈</button>
            </div>
        </div>

        <div id="schedule-screen">
            <div class="schedule-nav">
                <div class="schedule-header-title">🗺️ 우리의 일정</div>
                <button class="btn-back" onclick="showInvitation()">← 뒤로</button>
            </div>

            <div id="map">API 키를 입력하면 지도가 표시됩니다.</div>

            <button class="btn-open-modal" onclick="openModal()">+ 새 일정 장소 추가하기</button>

            <div class="day-card">
                <div class="day-title-tag">확정된 일정 ✨</div>
                <ul class="schedule-list" id="my-schedule-list">
                    <li class="schedule-item">
                        <span class="time-badge">도착</span>
                        <span class="item-text">청주 시외버스터미널</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div id="schedule-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">📌 새 일정 검색/추가</div>
            <input type="text" id="input-time" placeholder="시간 (예: 점심, 13:00)">
            <input type="text" id="input-place" placeholder="장소 검색 (예: 청주 성안길)">
            <div class="modal-actions">
                <button class="btn-modal-add" onclick="addKakaoSchedule()">장소 추가하기</button>
                <button class="btn-modal-close" onclick="closeModal()">취소</button>
            </div>
        </div>
    </div>

    <script>
        let map, ps;
        let isMapInitialized = false;
        let markers = [];

        function showSchedule() {
            document.getElementById('invitation-screen').style.display = 'none';
            document.getElementById('schedule-screen').classList.add('active');
            
            if (typeof kakao !== 'undefined' && kakao.maps && !isMapInitialized) {
                document.getElementById('map').innerText = ""; 
                
                var mapContainer = document.getElementById('map');
                var mapOption = {
                    center: new kakao.maps.LatLng(36.6267, 127.4342),
                    level: 5
                };
                map = new kakao.maps.Map(mapContainer, mapOption);
                ps = new kakao.maps.services.Places();
                
                var marker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(36.6267, 127.4342)
                });
                marker.setMap(map);
                markers.push(marker);

                isMapInitialized = true;
            } else if (isMapInitialized) {
                map.relayout();
            }
        }

        function showInvitation() {
            document.getElementById('schedule-screen').classList.remove('active');
            document.getElementById('invitation-screen').style.display = 'flex';
        }

        function openModal() {
            document.getElementById('schedule-modal').classList.add('active');
            document.getElementById('input-time').value = '';
            document.getElementById('input-place').value = '';
        }

        function closeModal() {
            document.getElementById('schedule-modal').classList.remove('active');
        }

        function addKakaoSchedule() {
            const timeVal = document.getElementById('input-time').value.trim() || "시간미정";
            const placeVal = document.getElementById('input-place').value.trim();

            if (!placeVal) {
                alert("장소를 입력해주세요!");
                return;
            }

            if (!ps) {
                alert("카카오맵 API 키가 설정되지 않았습니다.");
                return;
            }

            ps.keywordSearch(placeVal, function(data, status, pagination) {
                if (status === kakao.maps.services.Status.OK) {
                    var lat = data[0].y;
                    var lng = data[0].x;
                    var placeName = data[0].place_name;

                    var coords = new kakao.maps.LatLng(lat, lng);

                    var marker = new kakao.maps.Marker({
                        map: map,
                        position: coords
                    });
                    markers.push(marker);

                    map.setCenter(coords);
                    
                    var infowindow = new kakao.maps.InfoWindow({
                        content: `<div style="padding:5px;font-family:'Jua';font-size:14px;color:#000;">${placeName}</div>`
                    });
                    infowindow.open(map, marker);

                    // 화면 리스트에 추가
                    const ul = document.getElementById('my-schedule-list');
                    const li = document.createElement('li');
                    li.className = 'schedule-item';
                    li.innerHTML = `
                        <span class="time-badge">${timeVal}</span>
                        <span class="item-text">${placeName}</span>
                    `;
                    ul.appendChild(li);

                    // 👇 구글 스프레드 시트로 데이터 전송 (YOUR_GOOGLE_APPS_SCRIPT_URL_HERE 부분을 웹 앱 URL로 변경하세요)
                    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwS799Ew-6Y2qmtQaLGiZCqIsVP7agZ41dpngIDiXNAwKoWmPL8GKFHxTNvfz5z065c/exec'; 
                    if (WEB_APP_URL !== 'https://script.google.com/macros/s/AKfycbwS799Ew-6Y2qmtQaLGiZCqIsVP7agZ41dpngIDiXNAwKoWmPL8GKFHxTNvfz5z065c/exec') {
                        fetch(WEB_APP_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ time: timeVal, place: placeName })
                        }).catch(err => console.log('시트 전송 오류:', err));
                    }

                    closeModal();
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    alert('검색 결과가 존재하지 않습니다.');
                } else {
                    alert('검색 중 오류가 발생했습니다.');
                }
            });
        }
    </script>
</body>
</html>
