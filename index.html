<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>도쿄 여행 플래너</title>
  
  <style>
    :root {
      --primary: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-lg: 0 -4px 20px rgba(0, 0, 0, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #cbd5e1;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }

    /* Map Area */
    #map {
      width: 100%;
      height: 50vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Floating Bottom Sheet */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60vh;
      background: #ffffff;
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      z-index: 10;
      touch-action: none;
      transition: height 0.1s ease-out;
    }

    .bottom-sheet.dragging {
      transition: none;
    }

    .sheet-handle-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 0 10px 0;
      cursor: grab;
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 40px;
      height: 5px;
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    /* Day Chips Rail */
    .day-chips-container {
      padding: 0 16px 12px 16px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      -ms-overflow-style: none;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .day-chips-container::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 14px;
      border-radius: 12px;
      background: #f1f5f9;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .day-chip .chip-day {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .day-chip .chip-date {
      font-size: 0.68rem;
      margin-top: 1px;
    }

    .day-chip.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    /* Sheet Content */
    .sheet-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 90px;
      touch-action: pan-y;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 12px;
    }

    .timeline-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 22px;
      flex-shrink: 0;
    }

    .number-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .timeline-line {
      width: 2px;
      background-color: #cbd5e1;
      flex: 1;
      margin-top: 4px;
      margin-bottom: -4px;
    }

    .distance-wrapper {
      display: flex;
      align-items: center;
      padding: 6px 0 6px 34px;
    }

    .distance-badge {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2px 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .place-card {
      flex: 1;
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      position: relative;
    }

    .place-time {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .place-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
      padding-right: 18px;
    }

    .place-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Fixed Actions */
    .sheet-footer-fixed {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px 24px 16px;
      background: linear-gradient(to top, rgba(255,255,255,0.98) 70%, rgba(255,255,255,0));
      display: flex;
      gap: 8px;
      z-index: 20;
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
    }

    .action-btn {
      flex: 1;
      height: 46px;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .action-btn.secondary {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* Sub-page View (메모 추가 전용) */
    .sub-page {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sub-page.active {
      transform: translateY(0);
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .page-header h3 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .page-body {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      background: #f8fafc;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .page-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* Google InfoWindow Layout */
    .gm-style-iw-c {
      padding: 0 !important;
      border-radius: 14px !important;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
    }
    .gm-style-iw-d {
      overflow: hidden !important;
      padding: 0 !important;
      max-height: none !important;
    }
    .gm-ui-hover-effect {
      display: none !important;
    }
  </style>

  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDv4ueTAj-YS2GfoV6qoZr9Aj7KfG7Yo5olanguage=ko&region=KR" async defer></script>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- Map -->
    <div id="map"></div>

    <!-- Floating Bottom Sheet -->
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle-bar" id="sheetHandleBar">
        <div class="sheet-handle"></div>
      </div>

      <!-- Day Chips -->
      <div class="day-chips-container">
        <div class="day-chip active" onclick="selectDay(1)">
          <span class="chip-day">Day 1</span>
          <span class="chip-date">11.28 토</span>
        </div>
        <div class="day-chip" onclick="selectDay(2)">
          <span class="chip-day">Day 2</span>
          <span class="chip-date">11.29 일</span>
        </div>
        <div class="day-chip" onclick="selectDay(3)">
          <span class="chip-day">Day 3</span>
          <span class="chip-date">11.30 월</span>
        </div>
        <div class="day-chip" onclick="selectDay(4)">
          <span class="chip-day">Day 4</span>
          <span class="chip-date">12.01 화</span>
        </div>
        <div class="day-chip" onclick="selectDay(5)">
          <span class="chip-day">Day 5</span>
          <span class="chip-date">12.02 수</span>
        </div>
      </div>

      <!-- Sheet Content -->
      <div class="sheet-content">
        <div id="timelineList"></div>
      </div>

      <!-- Fixed Actions (메모 추가만 하단 독바에 유지) -->
      <div class="sheet-footer-fixed">
        <button class="action-btn secondary" onclick="openPage('memoPage')" style="width: 100%;">📝 메모 추가</button>
      </div>
    </div>

    <!-- Sub Page: Add Memo -->
    <div class="sub-page" id="memoPage">
      <div class="page-header">
        <button class="back-btn" onclick="closePage('memoPage')">← 취소</button>
        <h3>메모 추가</h3>
        <div style="width: 36px;"></div>
      </div>
      <div class="page-body">
        <div class="form-group">
          <label>관련 시간</label>
          <select id="memoTimeInput">
            <option value="">⏰ 시간 선택</option>
            <option value="07:00">07:00</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
            <option value="20:00">20:00</option>
            <option value="21:00">21:00</option>
            <option value="22:00">22:00</option>
          </select>
        </div>

        <div class="form-group">
          <label>메모 내용</label>
          <input type="text" id="memoTextInput" placeholder="예: 점심 식사 예약 장소 / 티켓 수령 등">
        </div>
      </div>
      <div class="page-footer">
        <button class="submit-btn" onclick="addMemo()">메모 추가하기</button>
      </div>
    </div>

  </div>

  <script>
    /* 도쿄 주요 추천 장소 데이터베이스 */
    const TOKYO_PLACES = [
      { name: "나리타 공항 T3", address: "Chiba, Narita, Furugome", lat: 35.7647, lng: 140.3863 },
      { name: "신주쿠역", address: "Shinjuku City, Tokyo", lat: 35.6905, lng: 139.7006 },
      { name: "시부야 스크램블 교차로", address: "Shibuya City, Tokyo", lat: 35.6595, lng: 139.7004 },
      { name: "아사쿠사 센소지", address: "2 Chome-3-1 Asakusa, Taito City, Tokyo", lat: 35.7148, lng: 139.7967 },
      { name: "아키하바라 전기상가", address: "Sotokanda, Chiyoda City, Tokyo", lat: 35.6983, lng: 139.7731 },
      { name: "긴자 팡메종", address: "3 Chome-5-2 Ginza, Chuo City, Tokyo", lat: 35.6713, lng: 139.7695 },
      { name: "도쿄타워", address: "4 Chome-2-8 Shibakoen, Minato City, Tokyo", lat: 35.6586, lng: 139.7454 },
      { name: "도쿄 스카이트리", address: "1 Chome-1-2 Oshiage, Sumida City, Tokyo", lat: 35.7100, lng: 139.8107 },
      { name: "롯폰기 힐즈", address: "6 Chome-10-1 Roppongi, Minato City, Tokyo", lat: 35.6604, lng: 139.7292 },
      { name: "메이지 신궁", address: "1-1 Yoyogikamizonocho, Shibuya City, Tokyo", lat: 35.6764, lng: 139.6993 },
      { name: "시부야 마크시티", address: "1 Chome-12-1 Dogenzaka, Shibuya City, Tokyo", lat: 35.6581, lng: 139.6995 },
      { name: "바스타 신주쿠", address: "5 Chome-24 Sendagaya, Shibuya City, Tokyo", lat: 35.6887, lng: 139.7005 },
      { name: "후지큐 하이랜드", address: "5 Chome-6-1 Shinishihara, Fujiyoshida, Yamanashi", lat: 35.4872, lng: 138.7806 },
      { name: "도쿄 디즈니씨", address: "1-1 Maihama, Urayasu, Chiba", lat: 35.6267, lng: 139.8881 },
      { name: "돈키호테 신주쿠가부키초점", address: "1 Chome-16-5 Kabukicho, Shinjuku City, Tokyo", lat: 35.6954, lng: 139.7020 }
    ];

    const INITIAL_DATA = {
      1: [
        { time: "10:55", name: "나리타 공항 T3", sub: "도착 & N'EX 이동", lat: 35.7647, lng: 140.3863, isMemo: false },
        { time: "12:30", name: "신주쿠역", sub: "짐 맡기기 및 주변 탐방", lat: 35.6905, lng: 139.7006, isMemo: false },
        { time: "14:00", name: "시부야 마크시티", sub: "쇼핑 및 점심 식사", lat: 35.6581, lng: 139.6995, isMemo: false }
      ],
      2: [
        { time: "09:30", name: "아사쿠사 센소지", sub: "전통 거리 산책", lat: 35.7148, lng: 139.7967, isMemo: false },
        { time: "12:00", name: "아키하바라 전기상가", sub: "거리 구경 & 점심", lat: 35.6983, lng: 139.7731, isMemo: false },
        { time: "14:30", name: "긴자 팡메종", sub: "원조 소금빵 테이크아웃", lat: 35.6713, lng: 139.7695, isMemo: false },
        { time: "16:00", name: "도쿄타워", sub: "일몰 및 야경 감상", lat: 35.6586, lng: 139.7454, isMemo: false }
      ],
      3: [
        { time: "06:45", name: "바스타 신주쿠", sub: "고속버스 탑승", lat: 35.6887, lng: 139.7005, isMemo: false },
        { time: "09:00", name: "후지큐 하이랜드", sub: "어트랙션 즐기기", lat: 35.4872, lng: 138.7806, isMemo: false }
      ],
      4: [
        { time: "08:30", name: "도쿄 디즈니씨", sub: "종일 관람", lat: 35.6267, lng: 139.8881, isMemo: false }
      ],
      5: [
        { time: "07:18", name: "신주쿠역", sub: "공항철도 탑승", lat: 35.6905, lng: 139.7006, isMemo: false },
        { time: "11:50", name: "나리타 공항 T3", sub: "귀국", lat: 35.7647, lng: 140.3863, isMemo: false }
      ]
    };

    let currentDay = 1;
    let tripData = {};
    let map = null;
    let markers = [];
    let activeInfoWindow = null;
    let flightPath = null;

    window.onload = () => {
      loadTripData();
      initBottomSheetGesture();
    };

    window.initMap = function() {
      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 12,
        center: { lat: 35.6812, lng: 139.7671 },
        disableDefaultUI: true,
        zoomControl: false
      });
      renderDay(currentDay);
      initExplorationMarkers();
    };

    setTimeout(() => {
      if (!map && typeof google !== 'undefined' && google.maps) {
        initMap();
      }
    }, 1000);

    function initBottomSheetGesture() {
      const sheet = document.getElementById('bottomSheet');
      const handleBar = document.getElementById('sheetHandleBar');
      const container = document.getElementById('appContainer');

      let startY = 0;
      let startHeight = 0;
      let isDragging = false;

      function onStart(e) {
        isDragging = true;
        sheet.classList.add('dragging');
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startHeight = sheet.getBoundingClientRect().height;
      }

      function onMove(e) {
        if (!isDragging) return;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = startY - currentY;
        const containerHeight = container.getBoundingClientRect().height;
        let newHeight = startHeight + deltaY;

        const minHeight = containerHeight * 0.3;
        const maxHeight = containerHeight * 0.88;

        if (newHeight < minHeight) newHeight = minHeight;
        if (newHeight > maxHeight) newHeight = maxHeight;

        sheet.style.height = `${newHeight}px`;
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        sheet.classList.remove('dragging');
      }

      handleBar.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onEnd);

      handleBar.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
    }

    function loadTripData() {
      const saved = localStorage.getItem('tokyo_planner_v29_map_add');
      if (saved) {
        tripData = JSON.parse(saved);
      } else {
        tripData = JSON.parse(JSON.stringify(INITIAL_DATA));
        saveTripData();
      }
    }

    function saveTripData() {
      localStorage.setItem('tokyo_planner_v29_map_add', JSON.stringify(tripData));
    }

    function selectDay(day) {
      currentDay = day;
      const chips = document.querySelectorAll('.day-chip');
      chips.forEach((chip, index) => {
        if (index + 1 === day) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });
      renderDay(day);
    }

    /* 지도상에 추천 장소 전체 핀(파란색 일반 핀) 표시 및 클릭 시 [+ 일정에 추가] 버튼 팝업 */
    function initExplorationMarkers() {
      TOKYO_PLACES.forEach(place => {
        const marker = new google.maps.Marker({
          position: { lat: place.lat, lng: place.lng },
          map: map,
          title: place.name,
          icon: {
            url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
          }
        });

        const infowindow = new google.maps.InfoWindow({
          content: `
            <div style="padding: 10px 14px; font-family: sans-serif; min-width: 170px;">
              <div style="font-size: 13px; font-weight: 800; color: #0f172a;">${place.name}</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 2px;">${place.address}</div>
              <button onclick="addPlaceFromMap('${place.name.replace(/'/g, "\\'")}', ${place.lat}, ${place.lng})" style="width: 100%; margin-top: 8px; background: #2563eb; color: white; border: none; border-radius: 8px; padding: 6px 0; font-size: 12px; font-weight: 700; cursor: pointer;">+ Day ${currentDay} 일정에 추가</button>
            </div>
          `
        });

        marker.addListener('click', () => {
          if (activeInfoWindow) activeInfoWindow.close();
          infowindow.open(map, marker);
          activeInfoWindow = infowindow;
        });
      });
    }

    /* 지도 팝업에서 직접 일정에 추가하는 함수 */
    window.addPlaceFromMap = function(name, lat, lng) {
      // 기본 방문 시간 자동 부여 (예: 가장 마지막 일정 시간 뒤 혹은 기본 12:00)
      const dayPlaces = tripData[currentDay] || [];
      let defaultTime = "12:00";
      if (dayPlaces.length > 0) {
        const lastTime = dayPlaces[dayPlaces.length - 1].time;
        if (lastTime) {
          let [hour, min] = lastTime.split(':').map(Number);
          hour = (hour + 2) % 24;
          defaultTime = `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        }
      }

      tripData[currentDay].push({
        time: defaultTime,
        name: name,
        sub: "지도에서 추가된 장소",
        lat: lat,
        lng: lng,
        isMemo: false
      });

      saveTripData();
      renderDay(currentDay);
      if (activeInfoWindow) activeInfoWindow.close();
      alert(`Day ${currentDay} 일정에 '${name}'이(가) 추가되었습니다!`);
    };

    function renderDay(day) {
      const places = tripData[day] || [];
      const listEl = document.getElementById('timelineList');
      listEl.innerHTML = '';

      if (flightPath) flightPath.setMap(null);

      const bounds = new google.maps.LatLngBounds();
      const pathCoords = [];

      places.forEach((place, index) => {
        const placeNum = index + 1;
        const pos = { lat: place.lat, lng: place.lng };

        if (!place.isMemo) {
          pathCoords.push(pos);
          bounds.extend(pos);
        }

        const itemEl = document.createElement('div');
        itemEl.className = 'timeline-item';
        
        if (!place.isMemo) {
          itemEl.onclick = () => {
            map.setCenter(pos);
            map.setZoom(14);
          };
        }

        const isLast = index === places.length - 1;

        itemEl.innerHTML = `
          <div class="timeline-left">
            <div class="number-badge" style="${place.isMemo ? 'background:#94a3b8;' : ''}">${place.isMemo ? '📌' : placeNum}</div>
            ${!isLast ? '<div class="timeline-line"></div>' : ''}
          </div>
          <div class="place-card" style="${place.isMemo ? 'background:#fef9c3; border-color:#fef08a;' : ''}">
            <button class="delete-btn" onclick="event.stopPropagation(); deletePlace(${index})">✕</button>
            <div class="place-time">${place.time || ''}</div>
            <div class="place-title">${place.name}</div>
            <div class="place-sub">${place.sub}</div>
          </div>
        `;

        listEl.appendChild(itemEl);

        if (!isLast && !place.isMemo) {
          const nextPlace = places[index + 1];
          if (nextPlace && !nextPlace.isMemo) {
            const dist = calculateDistance(place.lat, place.lng, nextPlace.lat, nextPlace.lng);
            const distEl = document.createElement('div');
            distEl.className = 'distance-wrapper';
            distEl.innerHTML = `<div class="distance-badge">${dist}km</div>`;
            listEl.appendChild(distEl);
          }
        }
      });

      if (pathCoords.length > 0 && map) {
        flightPath = new google.maps.Polyline({
          path: pathCoords,
          geodesic: true,
          strokeColor: '#2563eb',
          strokeOpacity: 0.85,
          strokeWeight: 3
        });
        flightPath.setMap(map);
        map.fitBounds(bounds);
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const d = R * c;
      return d < 10 ? d.toFixed(1) : Math.round(d);
    }

    function openPage(pageId) {
      document.getElementById(pageId).classList.add('active');
    }

    function closePage(pageId) {
      document.getElementById(pageId).classList.remove('active');
      document.getElementById('memoTimeInput').value = '';
      document.getElementById('memoTextInput').value = '';
    }

    function addMemo() {
      const time = document.getElementById('memoTimeInput').value;
      const text = document.getElementById('memoTextInput').value.trim();

      if (!time) {
        alert('시간을 선택해 주세요.');
        return;
      }

      if (!text) {
        alert('메모 내용을 입력해 주세요.');
        return;
      }

      tripData[currentDay].push({ 
        time, 
        name: text, 
        sub: "메모", 
        lat: 35.6812, 
        lng: 139.7671, 
        isMemo: true 
      });

      saveTripData();
      closePage('memoPage');
      renderDay(currentDay);
    }

    function deletePlace(index) {
      if (confirm('이 항목을 삭제하시겠습니까?')) {
        tripData[currentDay].splice(index, 1);
        saveTripData();
        renderDay(currentDay);
      }
    }
  </script>
</body>
</html>
