<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡️청주 여행 초특급 초대장⚡️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Single+Day&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-yellow: #ffe600;
            --pink-accent: #ff0055;
            --blue-accent: #0022ff;
            --green-accent: #00e676;
            --black: #000000;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gaegu', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #1a1a2e;
            background-image: radial-gradient(#ff007f 10%, transparent 11%), radial-gradient(#00d2ff 10%, transparent 11%);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-yellow);
            border: 4px solid var(--black);
            border-radius: 20px;
            box-shadow: 6px 8px 0px var(--black);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            margin: auto;
        }

        .sticker {
            position: absolute;
            z-index: 10;
            font-size: clamp(24px, 7vw, 32px);
            filter: drop-shadow(2px 2px 0px #000);
            user-select: none;
            pointer-events: none;
            animation: bounce 2.5s infinite ease-in-out;
        }

        .sticker-1 { top: 12px; right: 12px; transform: rotate(15deg); }
        .sticker-2 { top: 38%; left: -4px; transform: rotate(-20deg); }
        .sticker-3 { bottom: 90px; right: -2px; transform: rotate(25deg); }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(10deg); }
            50% { transform: translateY(-6px) rotate(-5deg); }
        }

        #invitation-screen {
            padding: 20px 8px 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .header-section {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 14px 0;
        }

        .red-badge {
            background-color: var(--pink-accent);
            color: var(--white);
            padding: 10px 14px;
            border-radius: 50% 40% 60% 45% / 40% 60% 40% 55%;
            border: 3.5px solid var(--black);
            font-size: clamp(20px, 5.5vw, 26px);
            font-weight: 700;
            line-height: 1.1;
            text-align: center;
            transform: rotate(-10deg);
            box-shadow: 3px 3px 0px var(--black);
            flex-shrink: 0;
        }

        .main-title {
            font-size: clamp(48px, 13vw, 64px);
            font-weight: 700;
            color: var(--blue-accent);
            text-shadow: 2px 2px 0px var(--white), 4px 4px 0px var(--black);
            letter-spacing: 2px;
            line-height: 1;
            transform: rotate(1deg);
            font-family: 'Single Day', cursive;
        }

        .sub-tag-box {
            background-color: var(--green-accent);
            border: 3.5px solid var(--black);
            padding: 6px 16px;
            border-radius: 24px;
            box-shadow: 3.5px 3.5px 0px var(--black);
            margin: 4px 0 16px 0;
            transform: rotate(-1deg);
            text-align: center;
            max-width: 98%;
        }

        .sub-tag {
            font-size: clamp(20px, 5.5vw, 25px);
            font-weight: 700;
            color: var(--black);
            white-space: nowrap;
        }

        .paper-box {
            width: 100%;
            background-color: var(--white);
            border: 3.5px solid var(--black);
            border-radius: 14px;
            padding: 18px 12px;
            box-shadow: 5px 5px 0px var(--black);
            margin-bottom: 16px;
            position: relative;
        }

        .tape-top {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 110px;
            height: 24px;
            background-color: rgba(255, 0, 128, 0.75);
            border: 2px solid var(--black);
        }

        .info-line {
            font-size: clamp(22px, 6vw, 27px);
            font-weight: 700;
            color: var(--black);
            margin-bottom: 12px;
            line-height: 1.35;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .info-line:last-child {
            margin-bottom: 0;
        }

        .info-line span.highlight {
            background-color: #a6f4ff;
            padding: 2px 8px;
            border-radius: 8px;
            border: 2px solid var(--black);
        }

        .info-line span.highlight-pink {
            background-color: #ffb3d9;
            padding: 2px 8px;
            border-radius: 8px;
            border: 2px solid var(--black);
        }

        .recruitment-banner {
            width: 100%;
            text-align: center;
            font-size: clamp(22px, 6vw, 27px);
            font-weight: 700;
            color: var(--pink-accent);
            background-color: var(--white);
            border: 3.5px solid var(--black);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 16px;
            box-shadow: 4px 4px 0px var(--black);
            letter-spacing: 1px;
        }

        .bottom-action-bar {
            width: calc(100% + 16px);
            margin-left: -8px;
            margin-right: -8px;
            background-color: var(--blue-accent);
            border-top: 4px solid var(--black);
            padding: 16px 12px;
            text-align: center;
            position: relative;
            z-index: 20;
        }

        .bottom-bar-text {
            font-size: clamp(17px, 4.8vw, 21px);
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--white);
            text-shadow: 1.5px 1.5px 0px var(--black);
        }

        .btn-enter {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--pink-accent);
            color: var(--white);
            border: 3.5px solid var(--black);
            border-radius: 35px;
            font-size: clamp(24px, 6.5vw, 30px);
            font-weight: 700;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            box-shadow: 0px 6px 0px var(--black);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 일정 화면 스타일 */
        #schedule-screen {
            display: none;
            padding: 18px 8px;
            background-color: var(--bg-yellow);
            flex-direction: column;
            width: 100%;
        }

        #schedule-screen.active {
            display: flex;
        }

        .schedule-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }

        .schedule-header-title {
            font-size: clamp(24px, 7vw, 32px);
            font-weight: 700;
            color: var(--blue-accent);
            background-color: var(--white);
            padding: 6px 12px;
            border: 3.5px solid var(--black);
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--black);
            font-family: 'Single Day', cursive;
        }

        .btn-back {
            background-color: var(--pink-accent);
            color: var(--white);
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--black);
            white-space: nowrap;
        }

        /* 일정 추가 입력폼 */
        .add-form-card {
            background-color: var(--white);
            border: 3.5px solid var(--black);
            border-radius: 14px;
            padding: 14px 12px;
            margin-bottom: 18px;
            box-shadow: 5px 5px 0px var(--black);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-title {
            font-size: clamp(20px, 5.5vw, 24px);
            font-weight: 700;
            color: var(--black);
            margin-bottom: 2px;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-control {
            border: 2.5px solid var(--black);
            border-radius: 8px;
            padding: 8px;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            outline: none;
            background-color: #fff;
        }

        .form-control:focus {
            background-color: #f0f8ff;
        }

        select.form-control {
            width: 95px;
            flex-shrink: 0;
            cursor: pointer;
        }

        input.form-control {
            width: 100%;
        }

        .btn-add {
            background-color: var(--green-accent);
            color: var(--black);
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 10px;
            font-size: clamp(20px, 5.5vw, 24px);
            font-weight: 700;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--black);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-add:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--black);
        }

        .loading-box {
            text-align: center;
            padding: 30px 16px;
            font-size: clamp(20px, 5.5vw, 26px);
            font-weight: 700;
            color: var(--black);
            background-color: var(--white);
            border: 3.5px solid var(--black);
            border-radius: 14px;
            box-shadow: 5px 5px 0px var(--black);
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .day-card {
            background-color: var(--white);
            border: 3.5px solid var(--black);
            border-radius: 14px;
            padding: 16px 10px;
            margin-bottom: 18px;
            box-shadow: 5px 5px 0px var(--black);
            position: relative;
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 16px;
            width: 75px;
            height: 22px;
            background-color: rgba(0, 230, 118, 0.85);
            border: 2px solid var(--black);
            transform: rotate(-4deg);
        }

        .day-title-tag {
            display: inline-block;
            background-color: var(--pink-accent);
            color: var(--white);
            font-size: clamp(22px, 6vw, 27px);
            font-weight: 700;
            padding: 3px 14px;
            border: 3px solid var(--black);
            border-radius: 24px;
            margin-bottom: 12px;
            box-shadow: 3px 3px 0px var(--black);
        }

        .day-title-tag.day2 {
            background-color: var(--blue-accent);
        }

        .schedule-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .schedule-item {
            display: flex;
            align-items: center;
            background-color: #f0f4ff;
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 10px 10px;
            font-size: clamp(21px, 5.8vw, 25px);
            font-weight: 700;
            gap: 8px;
            box-shadow: 3px 3px 0px var(--black);
        }

        .time-badge {
            background-color: var(--bg-yellow);
            color: var(--black);
            padding: 2px 8px;
            border: 2px solid var(--black);
            border-radius: 8px;
            font-size: clamp(17px, 4.5vw, 20px);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .item-text {
            color: var(--black);
            flex: 1;
            word-break: keep-all;
        }

        .footer-doodle {
            text-align: center;
            font-size: clamp(20px, 5.5vw, 24px);
            font-weight: 700;
            color: var(--black);
            background-color: var(--green-accent);
            border: 3.5px solid var(--black);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--black);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 첫번째 화면: 초대장 -->
        <div id="invitation-screen">
            <div class="sticker sticker-1">💖</div>
            <div class="sticker sticker-2">⭐</div>
            <div class="sticker sticker-3">💥</div>

            <div class="header-section">
                <div class="red-badge">청주<br>여행</div>
                <div class="main-title">초댓장</div>
            </div>

            <div class="sub-tag-box">
                <span class="sub-tag">♣ 주인공: 청주 놀러갈 사람 ♣</span>
            </div>

            <div class="paper-box">
                <div class="tape-top"></div>
                <div class="info-line">📍 <span class="highlight">목적지:</span> 충북 청주 일대 🗺️</div>
                <div class="info-line">🗓️ <span class="highlight">일시:</span> 1박 2일 힐링 투어 🚗</div>
                <div class="info-line">⚡️ <span class="highlight-pink">특징:</span> 맛집 폭격 & 꿀휴식 🍣</div>
                <div class="info-line">💯 <span class="highlight-pink">재미:</span> 999.99% 장담! 🔥</div>
            </div>

            <div class="recruitment-banner">
                ★ 상 ♡ 시 ♠ 모 ♥ 집 ☆
            </div>

            <div class="bottom-action-bar">
                <div class="bottom-bar-text">※ 아래 버튼을 누르면 일정 공개! ※</div>
                <button class="btn-enter" onclick="showSchedule()">
                    👉 일정 확인하기 👈
                </button>
            </div>
        </div>

        <!-- 두번째 화면: 일정표 -->
        <div id="schedule-screen">
            <div class="schedule-nav">
                <div class="schedule-header-title">🗺️ 청주 여행 일정표</div>
                <button class="btn-back" onclick="showInvitation()">← 초대장</button>
            </div>

            <!-- 일정 직접 추가 Form -->
            <div class="add-form-card">
                <div class="form-title">✏️ 새 일정 추가하기</div>
                <div class="form-row">
                    <select id="input-day" class="form-control">
                        <option value="1일차">1일차</option>
                        <option value="2일차">2일차</option>
                    </select>
                    <input type="text" id="input-time" class="form-control" placeholder="시간 (예: 점심, 14:00)">
                </div>
                <input type="text" id="input-text" class="form-control" placeholder="일정 내용을 입력하세요">
                <button onclick="addSchedule()" id="btn-add" class="btn-add">➕ 일정 등록하기</button>
            </div>

            <!-- 일정 목록이 뿌려지는 곳 -->
            <div id="schedule-content">
                <div class="loading-box">⏳ 일정을 불러오는 중입니다...</div>
            </div>

            <div class="footer-doodle">
                🎉 재미 1000% 보장! 준비완료! 🎉
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 구글 앱스 스크립트 웹앱 URL을 아래에 입력하세요.
        const GAS_WEBAPP_URL = '여기에_구글_웹앱_URL을_입력하세요';

        document.addEventListener('DOMContentLoaded', () => {
            loadScheduleFromSheet();
        });

        function showSchedule() {
            document.getElementById('invitation-screen').style.display = 'none';
            document.getElementById('schedule-screen').classList.add('active');
            window.scrollTo(0, 0);
        }

        function showInvitation() {
            document.getElementById('schedule-screen').classList.remove('active');
            document.getElementById('invitation-screen').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        // 구글 시트에서 일정 불러오기 (Read)
        async function loadScheduleFromSheet() {
            const scheduleContent = document.getElementById('schedule-content');

            if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.includes('여기에_구글_웹앱_URL')) {
                scheduleContent.innerHTML = `
                    <div class="loading-box" style="background:#fff3bf;">
                        ⚠️ Apps Script URL이 설정되지 않았습니다.<br>
                        <small style="font-size:15px; font-weight:normal;">코드 상단의 GAS_WEBAPP_URL을 설정해 주세요.</small>
                    </div>`;
                return;
            }

            scheduleContent.innerHTML = '<div class="loading-box">⏳ 일정을 불러오는 중입니다...</div>';

            try {
                const res = await fetch(GAS_WEBAPP_URL);
                if (!res.ok) throw new Error('네트워크 응답 오류');

                const data = await res.json(); // [[일자, 시간, 내용], ...]

                if (!data || data.length === 0) {
                    scheduleContent.innerHTML = `
                        <div class="loading-box">
                            🎈 아직 등록된 일정이 없습니다.<br>
                            <small style="font-size:16px; font-weight:normal;">위 입력창에서 일정을 직접 등록해 보세요!</small>
                        </div>`;
                    return;
                }

                renderSchedule(data);
            } catch (err) {
                console.error("로드 실패:", err);
                scheduleContent.innerHTML = `
                    <div class="loading-box" style="background:#ffe3e3;">
                        ❌ 일정을 불러오지 못했습니다.<br>
                        <small style="font-size:15px; font-weight:normal;">네트워크 상태나 구글 시트 배포 설정을 확인하세요.</small>
                    </div>`;
            }
        }

        // 화면에서 구글 시트로 일정 추가하기 (Write)
        async function addSchedule() {
            const day = document.getElementById('input-day').value;
            const time = document.getElementById('input-time').value.trim();
            const text = document.getElementById('input-text').value.trim();

            if (!time || !text) {
                alert('시간과 일정 내용을 모두 입력해주세요!');
                return;
            }

            const btn = document.getElementById('btn-add');
            btn.disabled = true;
            btn.innerText = '⏳ 저장 중...';

            try {
                await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ day, time, text }),
                    redirect: 'follow'
                });

                // 입력 폼 초기화
                document.getElementById('input-time').value = '';
                document.getElementById('input-text').value = '';

                // 데이터 재로드
                await loadScheduleFromSheet();
            } catch (err) {
                console.error("저장 오류:", err);
                alert('일정 저장에 실패했습니다.');
            } finally {
                btn.disabled = false;
                btn.innerText = '➕ 일정 등록하기';
            }
        }

        // 불러온 데이터 배열을 HTML 카드 형태로 렌더링
        function renderSchedule(rows) {
            let day1Html = '';
            let day2Html = '';

            rows.forEach(row => {
                const dayCategory = row[0] || '1일차';
                const time = row[1] || '';
                const text = row[2] || '';

                const itemHtml = `
                    <li class="schedule-item">
                        <span class="time-badge">${time}</span>
                        <span class="item-text">${text}</span>
                    </li>`;

                if (String(dayCategory).includes('2')) {
                    day2Html += itemHtml;
                } else {
                    day1Html += itemHtml;
                }
            });

            let fullHtml = '';
            if (day1Html) {
                fullHtml += `
                    <div class="day-card">
                        <div class="day-title-tag">1일차 ✨</div>
                        <ul class="schedule-list">${day1Html}</ul>
                    </div>`;
            }
            if (day2Html) {
                fullHtml += `
                    <div class="day-card">
                        <div class="day-title-tag day2">2일차 🌿</div>
                        <ul class="schedule-list">${day2Html}</ul>
                    </div>`;
            }

            if (!fullHtml) {
                fullHtml = `
                    <div class="loading-box">
                        🎈 아직 등록된 일정이 없습니다.<br>
                        <small style="font-size:16px; font-weight:normal;">위 입력창에서 일정을 직접 등록해 보세요!</small>
                    </div>`;
            }

            document.getElementById('schedule-content').innerHTML = fullHtml;
        }
    </script>
</body>
</html>
