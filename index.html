<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="style.css">

    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDv4ueTAj-YS2GfoV6qoZr9Aj7KfG7Yo5o&language=ko&region=KR"
      async defer>
    </script>
</head>

<body>

  <div class="app-container" id="appContainer">
    <!-- Map -->
    <div id="map"></div>

    <!-- Floating Bottom Sheet -->
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle-bar" id="sheetHandleBar">
        <div class="sheet-handle"></div>
      </div>

      <!-- Day Chips -->
      <div class="day-chips-container">
        <div class="day-chip active" onclick="selectDay(1)">
          <span class="chip-day">Day 1</span>
          <span class="chip-date">11.28 토</span>
        </div>
        <div class="day-chip" onclick="selectDay(2)">
          <span class="chip-day">Day 2</span>
          <span class="chip-date">11.29 일</span>
        </div>
        <div class="day-chip" onclick="selectDay(3)">
          <span class="chip-day">Day 3</span>
          <span class="chip-date">11.30 월</span>
        </div>
        <div class="day-chip" onclick="selectDay(4)">
          <span class="chip-day">Day 4</span>
          <span class="chip-date">12.01 화</span>
        </div>
        <div class="day-chip" onclick="selectDay(5)">
          <span class="chip-day">Day 5</span>
          <span class="chip-date">12.02 수</span>
        </div>
      </div>

      <!-- Sheet Content -->
      <div class="sheet-content">
        <div id="timelineList"></div>
      </div>

      <!-- Fixed Actions (장소 추가 및 메모 추가 버튼) -->
      <div class="sheet-footer-fixed">
        <button class="action-btn" onclick="openPage('addPage')">+ 장소 추가</button>
        <button class="action-btn secondary" onclick="openPage('memoPage')">📝 메모 추가</button>
      </div>
    </div>

    <!-- Sub Page: Add Place -->
    <div class="sub-page" id="addPage">
      <div class="page-header">
        <button class="back-btn" onclick="closePage('addPage')">← 취소</button>
        <h3>새 장소 추가</h3>
        <div style="width: 36px;"></div>
      </div>
      <div class="page-body">
        <div class="form-group">
          <label>방문 시간</label>
          <select id="placeTimeInput">
            <option value="">시간 선택</option>
            <option value="07:00">07:00</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
            <option value="20:00">20:00</option>
            <option value="21:00">21:00</option>
            <option value="22:00">22:00</option>
          </select>
        </div>

        <div class="form-group">
          <label>장소 검색</label>
          <div class="autocomplete-wrapper">
            <input type="text" id="placeSearchInput" placeholder="🔍 장소 검색 (예: 센소지, 도쿄타워)" oninput="filterPlaces(this.value)" autocomplete="off">
            <div id="autocompleteList" class="autocomplete-list"></div>
          </div>
        </div>

        <div class="form-group">
          <label>상세 설명</label>
          <input type="text" id="placeSubInput" placeholder="예: 전통 거리 산책 및 구경">
        </div>

        <input type="hidden" id="placeLat">
        <input type="hidden" id="placeLng">
      </div>
      <div class="page-footer">
        <button class="submit-btn" onclick="addPlace()">장소 추가하기</button>
      </div>
    </div>

    <!-- Sub Page: Add Memo -->
    <div class="sub-page" id="memoPage">
      <div class="page-header">
        <button class="back-btn" onclick="closePage('memoPage')">← 취소</button>
        <h3>메모 추가</h3>
        <div style="width: 36px;"></div>
      </div>
      <div class="page-body">
        <div class="form-group">
          <label>관련 시간</label>
          <select id="memoTimeInput">
            <option value="">시간 선택</option>
            <option value="07:00">07:00</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
            <option value="20:00">20:00</option>
            <option value="21:00">21:00</option>
            <option value="22:00">22:00</option>
          </select>
        </div>

        <div class="form-group">
          <label>메모 내용</label>
          <input type="text" id="memoTextInput" placeholder="예: 점심 식사 예약 장소 / 티켓 수령 등">
        </div>
      </div>
      <div class="page-footer">
        <button class="submit-btn" onclick="addMemo()">메모 추가하기</button>
      </div>
    </div>

  </div>

<script src="script.js" defer></script>
</body>
</html>
